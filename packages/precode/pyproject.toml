[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smorx-precode"
version = "0.1.0"
description = "Phase 7 Define+Analyze: change definition, intent compilation, constitutional constraints, intent ledger, semantic impact, verification planning, and the pre-coding lock gate."
requires-python = ">=3.11"
dependencies = ["smorx-contracts", "smorx-behavior"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
